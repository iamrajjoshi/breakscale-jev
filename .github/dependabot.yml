version: 2

updates:
  # Keep package.json and the npm lockfile in sync.
  # Group compatible updates to limit review noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':wrench: chore[deps]'
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs, so this is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ':wrench: chore[ci]'
    groups:
      actions:
        patterns:
          - '*'
