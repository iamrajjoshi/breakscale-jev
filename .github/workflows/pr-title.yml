name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'JS'
          const title = process.env.PR_TITLE ?? '';
          const format = /^:(?:sparkles|bug|books|recycle|wrench|mag|test_tube|zap|art): (?:feat|fix|docs|ref|chore|nit|test|perf|style)\[[a-z0-9][a-z0-9_-]*\]: \S(?:.*\S)?$/;
          if (!format.test(title)) {
            console.error('Use :emoji: verb[area]: brief description, for example :bug: fix[operator]: preserve watch after edits');
            process.exitCode = 1;
          }
          JS
